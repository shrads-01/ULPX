[package]
name = "ulpx-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
ulpx-core = { path = "../ulpx-core" }
ulpx-infer = { path = "../ulpx-infer" }
ulpx-ir = { path = "../ulpx-ir" }
ulpx-mapping = { path = "../ulpx-mapping" }
ulpx-onboard = { path = "../ulpx-onboard" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
walkdir = "2.3"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"]
