version: '3.8'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: ulpx_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    networks:
      - airgap_net

  ulpx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ulpx_airgap
    ports:
      - "3000:3000"
    environment:
      - ULPX_STORE_PATH=/data/.ulpx_store
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      - redpanda
    volumes:
      - ulpx_data:/data
    networks:
      - airgap_net

networks:
  airgap_net:
    name: ulpx_airgap_net
    driver: bridge
    # internal: true removed to allow pulling the image if not present, but for true airgap we'd load it from tar
    # internal: true 

volumes:
  ulpx_data:
