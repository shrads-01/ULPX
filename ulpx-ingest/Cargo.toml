[package]
name = "ulpx-ingest"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ulpx"
path = "src/main.rs"

[dependencies]
ulpx-core = { path = "../ulpx-core" }
sha2 = "0.11"
ulpx-replay = { path = "../ulpx-replay" }
ulpx-infer = { path = "../ulpx-infer" }
ulpx-mapping = { path = "../ulpx-mapping" }
ulpx-ir = { path = "../ulpx-ir" }
rskafka = "0.6.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3.34"


[dev-dependencies]
chrono = "=0.4.39"
