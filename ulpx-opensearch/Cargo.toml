[package]
name = "ulpx-opensearch"
version = "0.1.0"
edition = "2021"

[dependencies]
ulpx-replay = { path = "../ulpx-replay" }
ulpx-ir = { path = "../ulpx-ir" }
ulpx-mapping = { path = "../ulpx-mapping" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
ulpx-core = { path = "../ulpx-core" }
tokio = { version = "1.0", features = ["full"] }
testcontainers = "0.15"